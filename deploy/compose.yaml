# ==============================================================================
# Dispar Flux - Production Docker Compose (ADR 0004, ADR 0049)
# Isolated single-tenant architecture with internal network and Caddy reverse proxy
# ==============================================================================

name: dispar-flux

services:
  # ----------------------------------------------------------------------------
  # dispar-flux: Core Application Container (Node.js 22 LTS)
  # Isolated runtime hosting the REST API, WebSocket server, background worker,
  # and SQLite WAL database (ADR 0004). Port 3000 is strictly internal to the
  # bridge network and is NOT published to the host (ADR 0049).
  # ----------------------------------------------------------------------------
  dispar-flux:
    image: ghcr.io/rafaelmkn/dispar-flux:1.0.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - OPERATIONAL_TIMEZONE=${OPERATIONAL_TIMEZONE:-America/Sao_Paulo}
      - RECOVERY_KEY=${RECOVERY_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      - dispar-flux-data:/data
    networks:
      - dispar-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # caddy: Reverse Proxy & Edge Security (ADR 0049)
  # Handles automatic TLS certificate provisioning (Let's Encrypt / ZeroSSL),
  # HTTP->HTTPS redirects, HTTP/3 (UDP 443), security headers, and compression.
  # Proxies internal traffic to dispar-flux:3000 after health check passes.
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - dispar-net
    depends_on:
      dispar-flux:
        condition: service_healthy

# ------------------------------------------------------------------------------
# Persistent Volumes (ADR 0004 - Data Isolation)
# ------------------------------------------------------------------------------
volumes:
  # Persistent storage for SQLite, WhatsApp auth keys, media, and local backups
  dispar-flux-data:
    name: dispar-flux-data
  # Caddy certificates and runtime data
  caddy-data:
    name: dispar-caddy-data
  # Caddy dynamic configuration
  caddy-config:
    name: dispar-caddy-config

# ------------------------------------------------------------------------------
# Isolated Bridge Network (ADR 0049 - HTTPS Mandatory & Network Isolation)
# Ensures backend application is only accessible via the Caddy reverse proxy.
# ------------------------------------------------------------------------------
networks:
  dispar-net:
    name: dispar-flux-internal
    driver: bridge
